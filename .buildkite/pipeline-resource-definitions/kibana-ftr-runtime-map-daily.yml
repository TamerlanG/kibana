# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-kibana-ftr-runtime-map
  description: 'Daily FTR runtime coverage map collection for selective testing'
  links:
    - url: 'https://buildkite.com/elastic/kibana-ftr-runtime-map'
      title: Pipeline link
spec:
  type: buildkite-pipeline
  system: buildkite
  owner: 'group:kibana-operations'
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: kibana / ftr runtime map
      description: 'Runs all enabled FTR configs with runtime coverage recording and publishes the config → packages map'
    spec:
      env:
        SLACK_NOTIFICATIONS_CHANNEL: '#kibana-operations-alerts'
        KIBANA_SLACK_NOTIFICATIONS_ENABLED: 'true'
        SLACK_NOTIFICATIONS_SKIP_FOR_RETRIES: 'true'
      allow_rebuilds: true
      branch_configuration: main
      default_branch: main
      repository: elastic/kibana
      pipeline_file: .buildkite/pipelines/ftr_runtime_map/daily.yml
      initial_step_plugins:
        - sparse-checkout#v1.6.0:
            paths:
              - .buildkite/pipelines/ftr_runtime_map/daily.yml
            cleanup_sparse_state: true
      provider_settings:
        prefix_pull_request_fork_branch_names: false
        skip_pull_request_builds_for_existing_commits: true
        trigger_mode: none
      teams:
        kibana-operations:
          access_level: MANAGE_BUILD_AND_READ
        appex-qa:
          access_level: MANAGE_BUILD_AND_READ
        kibana-tech-leads:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: BUILD_AND_READ
      # Scheduled runs for the pipeline
      schedules:
        Daily 2 am UTC:
          cronline: 0 2 * * *
          message: Daily FTR runtime coverage map collection
          branch: main
      tags:
        - kibana

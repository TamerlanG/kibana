env:
  GITHUB_COMMIT_STATUS_ENABLED: 'false'
  # Arms per-config V8 coverage recording inside ftr_configs.sh; every FTR job
  # in this build uploads a <config-slug>.<job-id>.json.gz coverage summary.
  FTR_RUNTIME_MAP_ENABLED: 'true'
agents:
  image: family/kibana-ubuntu-2404
  imageProject: elastic-images-prod
  provider: gcp

steps:
  - command: .buildkite/scripts/lifecycle/pre_build.sh
    label: Pre-Build
    timeout_in_minutes: 10
    agents:
      machineType: n2-standard-2
    retry:
      automatic:
        - exit_status: '*'
          limit: 1
  - command: .buildkite/scripts/steps/store_cache.sh
    label: Store Cache for build
    timeout_in_minutes: 10
    id: store_cache
    soft_fail: true
    agents:
      machineType: n2-highcpu-8
      diskSizeGb: 130

  - wait

  - command: .buildkite/scripts/steps/build_kibana.sh
    label: Build Kibana Distribution
    agents:
      machineType: n2-standard-8
      preemptible: true
    key: build
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - wait

  - command: .buildkite/scripts/steps/ci_stats_ready.sh
    label: Mark CI Stats as ready
    agents:
      machineType: n2-standard-2
    timeout_in_minutes: 10
    depends_on:
      - build
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  - command: .buildkite/scripts/steps/test/pick_test_group_run_order.sh
    label: 'Pick Test Group Run Order'
    agents:
      machineType: n2-standard-2
    timeout_in_minutes: 15
    env:
      # Coverage collection only applies to FTR configs
      LIMIT_CONFIG_TYPE: 'functional'
      FTR_CONFIGS_SCRIPT: '.buildkite/scripts/steps/test/ftr_configs.sh'
      # Leave headroom inside the fixed 50-minute step cap: coverage recording
      # adds 10-30% to run time and summarizing adds 0.5-2 minutes per config.
      FUNCTIONAL_MAX_MINUTES: '20'
    retry:
      automatic:
        - exit_status: '*'
          limit: 1

  # The FTR jobs are uploaded dynamically by the step above and run here.
  - wait: ~
    continue_on_failure: true

  # Merge every uploaded coverage summary into the runtime map and publish it
  # to the GCS bucket (<branch>/latest.json + a dated history copy). Runs on
  # red days too — the map is still refreshed for the configs that did collect
  # (fail-open elsewhere).
  - command: .buildkite/scripts/steps/ftr_runtime_map/merge_and_publish.sh
    label: Merge and publish FTR runtime map
    agents:
      machineType: n2-standard-8
      diskSizeGb: 130
    timeout_in_minutes: 120

  - wait: ~
    continue_on_failure: true

  - command: .buildkite/scripts/lifecycle/post_build.sh
    label: Post-Build
    timeout_in_minutes: 10
    agents:
      machineType: n2-standard-2
